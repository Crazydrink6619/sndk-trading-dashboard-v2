<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SNDK Trading Dashboard</title>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #090b0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      max-width: 520px;
      margin: 40px auto;
      padding: 24px;
      background: #12151b;
      border: 1px solid #272b33;
      border-radius: 20px;
    }

    .label {
      color: #8b93a1;
      font-size: 14px;
    }

    .symbol {
      font-size: 26px;
      font-weight: 800;
      margin-top: 6px;
    }

    .price {
      font-size: 48px;
      font-weight: 800;
      margin: 18px 0 4px;
    }

    .change {
      font-size: 20px;
      font-weight: 700;
    }

    .positive {
      color: #38d996;
    }

    .negative {
      color: #ff5d6c;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .metric {
      background: #191d24;
      padding: 14px;
      border-radius: 12px;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 700;
      margin-top: 5px;
    }


    .decision-panel { margin-top:24px; padding:18px; background:#0d1015; border:1px solid #272b33; border-radius:16px; }
    .decision-title { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .decision-title strong { font-size:16px; }
    .decision-live { color:#38d996; font-size:12px; font-weight:700; }
    .signals { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .signal { padding:13px; background:#191d24; border:1px solid transparent; border-radius:12px; color:#747d8c; opacity:.56; transition:.2s ease; }
    .signal-name { font-size:17px; font-weight:800; }
    .signal-copy { margin-top:4px; font-size:12px; line-height:1.45; }
    .signal.active { color:#fff; opacity:1; transform:translateY(-1px); }
    .signal[data-state="dance"].active { background:#123226; border-color:#38d996; box-shadow:0 0 22px rgba(56,217,150,.12); }
    .signal[data-state="catch"].active { background:#132b38; border-color:#36bffa; box-shadow:0 0 22px rgba(54,191,250,.12); }
    .signal[data-state="watch"].active { background:#342b14; border-color:#f4c84a; box-shadow:0 0 22px rgba(244,200,74,.12); }
    .signal[data-state="run"].active { background:#39191e; border-color:#ff5d6c; box-shadow:0 0 22px rgba(255,93,108,.14); }
    .decision-reason { margin-top:12px; color:#c6ccd6; font-size:13px; line-height:1.6; }
    .indicator-row { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
    .indicator-chip { padding:5px 8px; background:#191d24; border-radius:999px; color:#9ba4b2; font-size:11px; }
    @media (max-width:520px) {
      body { padding:14px; }
      .card { margin:18px auto; padding:18px; }
      .signals { grid-template-columns:1fr; }
    }

    #status {
      margin-top: 20px;
      color: #8b93a1;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="label">LIVE MARKET DATA · ALPACA IEX</div>
    <div class="symbol">SNDK · SanDisk</div>

    <div id="price" class="price">Loading...</div>
    <div id="change" class="change">Connecting to Alpaca...</div>

    <div class="grid">
      <div class="metric">
        <div class="label">DAY LOW</div>
        <div id="low" class="metric-value">—</div>
      </div>

      <div class="metric">
        <div class="label">DAY HIGH</div>
        <div id="high" class="metric-value">—</div>
      </div>

      <div class="metric">
        <div class="label">VWAP</div>
        <div id="vwap" class="metric-value">—</div>
      </div>

      <div class="metric">
        <div class="label">VOLUME · IEX</div>
        <div id="volume" class="metric-value">—</div>
      </div>
    </div>


    <section class="decision-panel" aria-live="polite">
      <div class="decision-title"><strong>即時交易判斷</strong><span class="decision-live">● LIVE · 5秒更新</span></div>
      <div class="signals">
        <div class="signal" data-state="dance"><div class="signal-name">🕺 蹦迪</div><div class="signal-copy">量價轉強，順勢區</div></div>
        <div class="signal" data-state="catch"><div class="signal-name">🤲 接妹</div><div class="signal-copy">回到支撐，短線止跌</div></div>
        <div class="signal active" data-state="watch"><div class="signal-name">👀 觀察</div><div class="signal-copy">訊號不足，先不追</div></div>
        <div class="signal" data-state="run"><div class="signal-name">🏃 烙跑</div><div class="signal-copy">跌破支撐，動能轉弱</div></div>
      </div>
      <div id="decisionReason" class="decision-reason">正在等待足夠的即時市場資料…</div>
      <div id="indicatorRow" class="indicator-row"></div>
    </section>

    <div id="status">Waiting for market data...</div>
  </div>

<script>
  const FUNCTION_URL = "https://otsbyahgetgedgcpumzk.supabase.co/functions/v1/alpaca-market-data";
  const POLL_INTERVAL_MS = 5000;
  const REQUEST_TIMEOUT_MS = 10000;

  let pollTimerId = null;
  let requestInFlight = false;

  function unwrapPayload(result) {
    let payload = result;

    // Older diagnostic wrapper: { body: "{...}" } or { body: {...} }
    if (payload && payload.body != null) {
      payload = typeof payload.body === "string"
        ? JSON.parse(payload.body)
        : payload.body;
    }

    if (!payload || typeof payload !== "object") {
      throw new Error("Invalid market-data response");
    }

    return payload;
  }

  function normalizeMarketData(payload) {
    // v0.3/current: market fields are top-level.
    // v0.4: market fields live under payload.snapshot.
    const snapshot =
      payload.snapshot && typeof payload.snapshot === "object"
        ? payload.snapshot
        : payload;

    const latest1Min = payload.latest?.["1Min"] ?? null;
    const latest5Min = payload.latest?.["5Min"] ?? null;

    const latestTrade =
      snapshot.latestTrade ??
      payload.latestTrade ??
      null;

    const dailyBar =
      snapshot.dailyBar ??
      payload.dailyBar ??
      null;

    const prevDailyBar =
      snapshot.prevDailyBar ??
      payload.prevDailyBar ??
      null;

    // Prefer the latest trade. Fall back to newest minute/bar close so the
    // dashboard still shows a live-ish price when a snapshot omits latestTrade.
    const price =
      latestTrade?.p ??
      latest1Min?.c ??
      latest5Min?.c ??
      dailyBar?.c ??
      null;

    const marketTime =
      latestTrade?.t ??
      latest1Min?.t ??
      latest5Min?.t ??
      dailyBar?.t ??
      null;

    return {
      price,
      marketTime,
      latest1Min,
      latest5Min,
      dailyBar,
      prevDailyBar,
      feed: payload.feed ?? "iex",
      version: payload.version ?? null,
    };
  }

  function setMetric(id, value, options = {}) {
    const el = document.getElementById(id);
    if (value == null || !Number.isFinite(Number(value))) {
      el.textContent = "—";
      return;
    }

    const number = Number(value);
    if (options.currency) {
      el.textContent = "$" + number.toFixed(2);
    } else if (options.integer) {
      el.textContent = Math.round(number).toLocaleString();
    } else {
      el.textContent = String(number);
    }
  }


  function finiteNumber(value) {
    const number = Number(value);
    return Number.isFinite(number) ? number : null;
  }

  function formatSigned(value, digits = 2) {
    if (!Number.isFinite(value)) return "—";
    return (value >= 0 ? "+" : "") + value.toFixed(digits) + "%";
  }

  function calculateDecision(data) {
    const price = finiteNumber(data.price);
    const previousClose = finiteNumber(data.prevDailyBar?.c);
    const low = finiteNumber(data.dailyBar?.l);
    const high = finiteNumber(data.dailyBar?.h);
    const vwap = finiteNumber(data.dailyBar?.vw);
    const oneMinClose = finiteNumber(data.latest1Min?.c);
    const oneMinVolume = finiteNumber(data.latest1Min?.v);
    const fiveMinOpen = finiteNumber(data.latest5Min?.o);
    const fiveMinVolume = finiteNumber(data.latest5Min?.v);

    const changePct = price != null && previousClose
      ? ((price - previousClose) / previousClose) * 100 : null;
    const vwapDistancePct = price != null && vwap
      ? ((price - vwap) / vwap) * 100 : null;
    const momentumPct = oneMinClose != null && fiveMinOpen
      ? ((oneMinClose - fiveMinOpen) / fiveMinOpen) * 100 : null;
    const rangePosition = price != null && low != null && high != null && high > low
      ? ((price - low) / (high - low)) * 100 : null;
    const volumeRatio = oneMinVolume != null && fiveMinVolume && fiveMinVolume > 0
      ? oneMinVolume / (fiveMinVolume / 5) : null;

    const enough = price != null && vwapDistancePct != null && rangePosition != null;
    const breakdown = enough && (
      (vwapDistancePct <= -0.35 && momentumPct != null && momentumPct <= -0.20) ||
      (changePct != null && changePct <= -1.5 && rangePosition <= 35)
    );
    const breakout = enough && vwapDistancePct >= 0.20 && rangePosition >= 60 &&
      changePct != null && changePct > 0 && (momentumPct == null || momentumPct >= 0.15);
    const supportBounce = enough && Math.abs(vwapDistancePct) <= 0.35 &&
      rangePosition >= 20 && rangePosition <= 65 &&
      (momentumPct == null || momentumPct >= 0.05) &&
      (changePct == null || changePct > -1.5);

    let state = "watch";
    let reason = enough
      ? "訊號還沒有形成共振，先等價格、VWAP 與短線動能方向一致。"
      : "目前資料不足，安全起見維持觀察，不產生進出場訊號。";

    if (breakdown) {
      state = "run";
      reason = "價格弱於 VWAP，且短線動能或日內位置同步轉弱；優先控制風險。";
    } else if (breakout) {
      state = "dance";
      reason = "價格站上 VWAP、位於日內強勢區，且短線動能向上；屬於順勢觀察區。";
    } else if (supportBounce) {
      state = "catch";
      reason = "價格貼近 VWAP 支撐、未落入日內弱勢區，短線動能止跌回升。";
    }

    return { state, reason, changePct, vwapDistancePct, momentumPct, rangePosition, volumeRatio };
  }

  function renderDecision(data) {
    const decision = calculateDecision(data);
    document.querySelectorAll(".signal").forEach((element) => {
      element.classList.toggle("active", element.dataset.state === decision.state);
    });
    document.getElementById("decisionReason").textContent = decision.reason;

    const indicators = [
      "VWAP差 " + formatSigned(decision.vwapDistancePct),
      "當日漲跌 " + formatSigned(decision.changePct),
      "5分動能 " + formatSigned(decision.momentumPct),
      "日內位置 " + (Number.isFinite(decision.rangePosition) ? decision.rangePosition.toFixed(0) + "%" : "—"),
      "1分量能 " + (Number.isFinite(decision.volumeRatio) ? decision.volumeRatio.toFixed(2) + "x" : "—"),
    ];
    document.getElementById("indicatorRow").innerHTML = indicators
      .map((label) => '<span class="indicator-chip">' + label + "</span>").join("");
  }

  function renderMarketData(data) {
    const price = Number(data.price);
    if (!Number.isFinite(price)) {
      throw new Error("No SNDK price returned");
    }

    const previousClose = Number(data.prevDailyBar?.c);
    const hasPreviousClose = Number.isFinite(previousClose) && previousClose !== 0;

    document.getElementById("price").textContent = "$" + price.toFixed(2);

    const changeEl = document.getElementById("change");
    if (hasPreviousClose) {
      const change = price - previousClose;
      const changePercent = (change / previousClose) * 100;
      const sign = change >= 0 ? "+" : "";

      changeEl.textContent =
        `${sign}${change.toFixed(2)}  (${sign}${changePercent.toFixed(2)}%)`;
      changeEl.className =
        "change " + (change >= 0 ? "positive" : "negative");
    } else {
      changeEl.textContent = "Live price connected";
      changeEl.className = "change";
    }

    setMetric("low", data.dailyBar?.l, { currency: true });
    setMetric("high", data.dailyBar?.h, { currency: true });
    setMetric("vwap", data.dailyBar?.vw, { currency: true });
    setMetric("volume", data.dailyBar?.v, { integer: true });
    renderDecision(data);

    const parts = ["Alpaca IEX connected ✓"];

    if (data.marketTime) {
      const marketDate = new Date(data.marketTime);
      if (!Number.isNaN(marketDate.getTime())) {
        parts.push("Market: " + marketDate.toLocaleString("zh-TW", {
          hour12: false,
        }));
      }
    }

    parts.push("Updated: " + new Date().toLocaleTimeString("zh-TW", {
      hour12: false,
    }));

    if (data.version) {
      parts.push("API " + data.version);
    }

    document.getElementById("status").textContent = parts.join(" · ");
  }

  async function loadSNDK() {
    if (requestInFlight) return;
    requestInFlight = true;

    const status = document.getElementById("status");
    const controller = new AbortController();
    const requestTimeoutId = setTimeout(
      () => controller.abort(),
      REQUEST_TIMEOUT_MS,
    );

    try {
      status.textContent = "Fetching live SNDK market data...";

      const response = await fetch(FUNCTION_URL + "?t=" + Date.now(), {
        method: "GET",
        cache: "no-store",
        headers: {
          Accept: "application/json",
        },
        signal: controller.signal,
      });

      const text = await response.text();
      let result;

      try {
        result = text ? JSON.parse(text) : {};
      } catch {
        throw new Error(`HTTP ${response.status}: invalid JSON`);
      }

      if (!response.ok) {
        const payload = unwrapPayload(result);
        throw new Error(
          payload.error ||
          `Market data request failed (HTTP ${response.status})`,
        );
      }

      const payload = unwrapPayload(result);

      if (payload.ok === false) {
        throw new Error(payload.error || "Alpaca market-data request failed");
      }

      renderMarketData(normalizeMarketData(payload));
    } catch (error) {
      console.error(error);

      const message = error?.name === "AbortError"
        ? "Market data request timed out"
        : (error?.message || String(error));

      // Keep the last valid price on screen during a temporary API hiccup.
      if (document.getElementById("price").textContent === "Loading...") {
        document.getElementById("price").textContent = "ERROR";
        document.getElementById("change").textContent = "Unable to load SNDK";
      }

      status.textContent = "Connection error · " + message;
    } finally {
      clearTimeout(requestTimeoutId);
      requestInFlight = false;
    }
  }

  function scheduleNextPoll() {
    if (pollTimerId !== null) {
      clearTimeout(pollTimerId);
    }

    pollTimerId = setTimeout(async () => {
      if (!document.hidden) {
        await loadSNDK();
      }
      scheduleNextPoll();
    }, POLL_INTERVAL_MS);
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) {
      loadSNDK();
    }
  });

  loadSNDK();
  scheduleNextPoll();
</script>

</body>
</html>
